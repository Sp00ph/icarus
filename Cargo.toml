[package]
name = "icarus"
version = "1.1.1"
edition = "2024"
license-file = "LICENSE"

[dependencies]
arrayvec = "0.7.6"
rustyline = "17.0.2"
thiserror = "2.0.17"
atomic-wait = "1.1.0"
smallvec = "1.15.1"
rand = { version = "0.9.2", features = ["small_rng"] }
anyhow = "1.0.100"
viriformat = { version = "3.0.0", optional = true }
clap = { version = "4.5.60", features = ["derive"], optional = true }
indicatif = { version = "0.18.4", optional = true }
memmap2 = "0.9.10"
color-backtrace = "0.7.2"
enum-map = "3.1.0"
zerocopy = { version = "0.8.63", features = ["derive"] }

[features]
test-islegal = []
use-bmi2 = []
perft-all-960 = []
datagen = ["dep:viriformat", "dep:clap", "dep:indicatif"]
count-act = []
count-coact = []
count-nnz = []
tune = []
default = []

[profile.release]
debug = "full"
